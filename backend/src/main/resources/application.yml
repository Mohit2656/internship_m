spring:
  application:
    name: ims-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/internship_management}
    username: ${DB_USERNAME:ims_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:${DOCUMENT_MAX_FILE_SIZE:20MB}}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:${DOCUMENT_MAX_REQUEST_SIZE:21MB}}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
server:
  tomcat:
    max-swallow-size: 23MB
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
app:
  workplace-search:
    # Photon public demo: best effort, explicit searches, one backend instance only.
    # Configure your own Photon provider for larger or multiple-instance deployments.
    base-url: ${WORKPLACE_SEARCH_BASE_URL:https://photon.komoot.io}
    connect-timeout-seconds: ${WORKPLACE_SEARCH_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${WORKPLACE_SEARCH_READ_TIMEOUT_SECONDS:5}
  monthly-progress:
    max-photo-size-bytes: ${MONTHLY_PROGRESS_MAX_PHOTO_SIZE_BYTES:20971520}
  attendance:
    zone: ${ATTENDANCE_ZONE:Asia/Kolkata}
    absence:
      enabled: ${ATTENDANCE_ABSENCE_ENABLED:true}
      initial-delay-ms: 10000
      fixed-delay-ms: 300000
    calendar:
      holidays: []
      approved-leave: {}
    default-geofence-radius-meters: ${ATTENDANCE_DEFAULT_GEOFENCE_RADIUS_METERS:100}
    # Maximum reported uncertainty in metres, independent of each workplace's radius.
    # Returned by today's attendance policy so the browser uses the same configured limit.
    max-gps-accuracy-meters: ${ATTENDANCE_MAX_GPS_ACCURACY_METERS:200}
    max-location-age-seconds: ${ATTENDANCE_MAX_LOCATION_AGE_SECONDS:300}
    max-image-size-bytes: ${ATTENDANCE_MAX_IMAGE_SIZE_BYTES:5242880}
    max-metadata-location-difference-meters: ${ATTENDANCE_MAX_METADATA_LOCATION_DIFFERENCE_METERS:100}
    max-metadata-age-seconds: ${ATTENDANCE_MAX_METADATA_AGE_SECONDS:600}
    ai-session-duration-seconds: ${ATTENDANCE_AI_SESSION_DURATION_SECONDS:180}
  profile-encryption-key: ${PROFILE_ENCRYPTION_KEY}
  file-storage:
    root: ${DOCUMENT_STORAGE_ROOT:./data/internship-documents}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:10485760}
    resume-max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:5242880}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    cookie-name: ${JWT_COOKIE_NAME:ims_auth}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3010, http://iiic.cse.stvincentngp.edu.in, https://iiic.cse.stvincentngp.edu.in}
  resume-ai:
    base-url: ${RESUME_AI_BASE_URL:http://127.0.0.1:8091}
    connect-timeout-seconds: ${RESUME_AI_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${RESUME_AI_READ_TIMEOUT_SECONDS:120}
  opportunity-ai:
    base-url: ${OPPORTUNITY_AI_BASE_URL:${RESUME_AI_BASE_URL:http://127.0.0.1:8091}}
    connect-timeout-seconds: ${OPPORTUNITY_AI_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${OPPORTUNITY_AI_READ_TIMEOUT_SECONDS:120}
  opportunity-matching:
    strong-match-threshold: ${OPPORTUNITY_STRONG_MATCH_THRESHOLD:75}
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  students:
    emails: ${BOOTSTRAP_STUDENT_EMAILS:}
    passwords: ${BOOTSTRAP_STUDENT_PASSWORDS:}
