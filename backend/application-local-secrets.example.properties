# Copy this file to application-local-secrets.properties and replace every required placeholder once.
# The real file is ignored by Git and is loaded only by the local Spring profile.
DB_URL=jdbc:postgresql://localhost:5432/internship_management
DB_USERNAME=ims_user
DB_PASSWORD=CHANGE_ME
JWT_SECRET=CHANGE_ME_WITH_AT_LEAST_32_BYTES
PROFILE_ENCRYPTION_KEY=CHANGE_ME_WITH_BASE64_ENCODED_32_BYTES

# Set these only when an initial bootstrap account is needed. Bootstrap creation is idempotent.
BOOTSTRAP_ADMIN_EMAIL=
BOOTSTRAP_ADMIN_PASSWORD=
BOOTSTRAP_STUDENT_EMAILS=
BOOTSTRAP_STUDENT_PASSWORDS=
